<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bpaas-design-system" content="editorial-apple">
    <meta name="bpaas-design-theme" content="kr-warm-grid">
    <title>트렌드 — 유흥 이용 가이드</title>

    <meta name="keywords" content="유흥 트렌드, 셔츠룸 변화, 하이퍼블릭 성장, 텐카페 시장, 서울 유흥 통계, 업종별 소비 데이터, 유흥 규제, MZ세대 유흥, 프리미엄 룸싸롱, 가라오케 트렌드">

    <style>
        :root {
            --bg-primary: #FAFAF8;
            --bg-secondary: #F4F4F0;
            --bg-card: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #5C5C5C;
            --text-tertiary: #8E8E8E;
            --border-subtle: #E8E8E4;
            --border-card: #ECECE8;
            --accent-graphite: #2C2C2C;
            --accent-charcoal: #3D3D3D;
            --accent-warm: #B8860B;
            --tag-bg: #F8F8F5;
            --tag-text: #6B6B6B;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --max-width: 1200px;
            --nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.011em;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250,250,248,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            height: var(--nav-height);
            display: flex;
            align-items: center;
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 32px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-gold);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.5px;
        }

        .logo-text {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.2px;
            transition: color 0.2s ease;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-gold);
        }

        .page-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        .page-eyebrow {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--text-tertiary);
            font-weight: 400;
            max-width: 640px;
            line-height: 1.5;
            margin-bottom: 48px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 28px 24px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .section-header {
            margin-bottom: 28px;
        }

        .section-header h2 {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .section-header p {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 600px;
        }

        .trend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 60px;
        }

        .trend-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease;
        }

        .trend-card:hover {
            box-shadow: var(--shadow-md);
        }

        .trend-card-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text, #6B6B6B);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .trend-card h3 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .trend-card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .trend-card .data-point {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .data-highlight {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 15px;
        }

        .insight-banner {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 36px 40px;
            margin-bottom: 60px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .insight-banner-quote {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            line-height: 1.5;
            flex: 1;
        }

        .insight-banner-source {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
            white-space: nowrap;
            padding-top: 4px;
        }

        .timeline-section {
            margin-bottom: 60px;
        }

        .timeline-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .timeline-item {
            display: flex;
            gap: 24px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            align-items: flex-start;
        }

        .timeline-date {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-gold);
            min-width: 90px;
            letter-spacing: -0.2px;
            padding-top: 2px;
        }

        .timeline-content h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .timeline-content p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .related-links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }

        .related-link-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .related-link-card:hover {
            box-shadow: var(--shadow-md);
        }

        .related-link-card span {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .related-link-card h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .faq-section {
            margin-bottom: 40px;
        }

        .faq-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .faq-item {
            border-bottom: 1px solid var(--border-subtle);
            padding: 20px 0;
        }

        .faq-question {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .faq-answer {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .site-footer {
            border-top: 1px solid var(--border-subtle);
            padding: 32px 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 0.2px;
        }

        .disclaimer-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.6;
            margin-top: 40px;
        }

        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .trend-grid {
                grid-template-columns: 1fr;
            }
            .related-links-grid {
                grid-template-columns: 1fr;
            }
            .insight-banner {
                flex-direction: column;
                gap: 16px;
                padding: 24px;
            }
            .page-title {
                font-size: 34px;
            }
            .nav-links {
                gap: 16px;
            }
            .header-inner {
                padding: 0 20px;
            }
            .page-container {
                padding: 32px 20px 60px;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .timeline-item {
                flex-direction: column;
                gap: 6px;
            }

                font-size: 28px;

</body>
