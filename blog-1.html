<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bpaas-design-system" content="editorial-apple">
    <meta name="bpaas-design-theme" content="kr-warm-grid">
    <title>유흥 이용 가이드 — 처음 접점을 위한 업종별 차이 안내</title>
    <meta name="description" content="서울 지역 셔츠룸·룸싸롱·텐카페·하이퍼블릭·가라오케까지 업종별 차이와 이용 절차를 처음 접하는 사람 눈높이로 비교 정리한 안내형 블로그입니다. 특정 업소 추천 없이 객관적 정보만 제공합니다.">
    <meta name="keywords" content="유흥 이용 가이드, 셔츠룸, 룸싸롱, 텐프로, 텐카페, 쩜오, 하이퍼블릭, 풀싸롱, 가라오케, 비즈니스클럽, 마사지, 펍, 서울 유흥 정보">
    <link rel="canonical" href="https://notewell.site/blog-1.html">
    <meta property="og:title" content="유흥 이용 가이드 — 처음 접점을 위한 업종별 차이 안내">
    <meta property="og:description" content="서울 지역 셔츠룸·룸싸롱·텐카페·가라오케 등 업종별 차이와 이용 절차">
    <style>
        :root {
            --bg-primary: #fafaf8;
            --bg-secondary: #f3f2ef;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border-subtle: #e5e5e0;
            --border-medium: #d2d2cd;
            --accent-warm: #c44d34;
            --accent-cool: #2d6a4f;
            --accent-neutral: #7f5539;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-serif: 'Noto Serif KR', 'Times New Roman', serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2.5rem;
            --spacing-xl: 4rem;
            --spacing-2xl: 6rem;
            --max-width: 1140px;
            --max-width-narrow: 780px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.011em;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        .container-narrow {
            max-width: var(--max-width-post);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        /* Navigation */
        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250,250,248,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.9rem 0;
        }

        .nav-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .nav-logo span {
            color: var(--accent-warm);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            letter-spacing: -0.01em;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a.active {
            color: var(--accent-warm);
            font-weight: 600;
        }

        /* Hero Section */
        .hero-guide {
            padding: var(--spacing-2xl) 0 var(--spacing-xl);
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .hero-eyebrow {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-cool);
            background: #f0f7f4;
            padding: 0.35rem 1rem;
            border-radius: 20px;
            margin-bottom: var(--spacing-md);
        }

        .hero-guide h1 {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .hero-guide .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: var(--spacing-lg);
            font-size: 0.85rem;
            color: var(--text-tertiary);
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Table of Contents */
        .toc-section {
            padding: var(--spacing-xl) 0;
        }

        .toc-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .toc-box h3 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .toc-list li a {
            display: inline-block;
            text-decoration: none;
            color: var(--accent-cool);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1.1rem;
            border: 1px solid var(--border-medium);
            border-radius: 25px;
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }

        .toc-list li a:hover {
            background: var(--accent-cool);
            color: #ffffff;
            border-color: var(--accent-cool);
        }

        /* Content Sections */
        .content-section {
            padding: var(--spacing-xl) 0;
        }

        .content-section h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
            position: relative;
        }

        .content-section h2::after {
            content: '';
            display: block;
            width: 48px;
            height: 3px;
            background: var(--accent-warm);
            margin-top: var(--spacing-xs);
            border-radius: 2px;
        }

        .content-section h3 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            margin: var(--spacing-lg) 0 var(--spacing-sm);
            color: var(--text-primary);
        }

        .content-section h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: var(--spacing-md) 0 var(--spacing-xs);
            color: var(--text-primary);
        }

        .content-section p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            line-height: 1.8;
        }

        .content-section ul, .content-section ol {
            margin: var(--spacing-sm) 0 var(--spacing-md) 1.5rem;
            color: var(--text-secondary);
        }

        .content-section li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        /* Comparison Table */
        .comparison-table-wrap {
            overflow-x: auto;
            margin: var(--spacing-lg) 0;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background: var(--bg-secondary);
        }

        .comparison-table thead th {
            background: var(--accent-cool);
            color: #ffffff;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .comparison-table tbody td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }

        .comparison-table tbody tr:last-child td {
            border-bottom: none;
        }

        .comparison-table tbody tr:hover {
            background: #f9f8f6;
        }

        .comparison-table .category-cell {
            font-weight: 600;
            color: var(--text-primary);
            background: #f5f4f0;
        }

        /* Info Cards */
        .info-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-md);
            margin: var(--spacing-lg) 0;
        }

        .info-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .info-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .info-card .card-icon {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-sm);
            color: var(--accent-cool);
        }

        .info-card h4 {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .info-card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 0;
        }

        /* Highlight Box */
        .highlight-box {
            background: #fdf8f5;
            border-left: 4px solid var(--accent-warm);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            margin: var(--spacing-lg) 0;
        }

        .highlight-box p {
            margin-bottom: 0;
            font-weight: 500;
            color: #5c3a2e;
        }

        /* FAQ Accordion Style */
        .faq-list {
            margin: var(--spacing-lg) 0;
        }

        .faq-item {
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-sm);
            background: var(--bg-secondary);
            overflow: hidden;
        }

        .faq-question {
            padding: var(--spacing-md) var(--spacing-lg);
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: var(--font-sans);
        }

        .faq-answer {
            padding: 0 var(--spacing-lg) var(--spacing-md);
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* Footer */
        .site-footer {
            border-top: 1px solid var(--border-subtle);
            padding: var(--spacing-xl) 0;
            margin-top: var(--spacing-2xl);
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        .site-footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            list-style: none;
            margin-bottom: var(--spacing-sm);
        }

        .site-footer .footer-links a {
            text-decoration: none;
            color: var(--text-secondary);
        }

        .disclaimer-text {
            margin-top: var(--spacing-md);
            font-size: 0.8rem;
            color: var(--text-tertiary);
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-guide h1 {
                font-size: 2.2rem;
            }
            .
</body>
</html>
