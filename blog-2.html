<html lang="ko">
<head>

    <meta property="og:title" content="비교 — 유흥 업종별 객관적 차이 분석">
    <meta property="og:description" content="셔츠룸부터 가라오케까지, 6가지 핵심 기준으로 비교한 서울 유흥 업종 분석. 데이터 기반 객관적 정보만 제공합니다.">
    <style>
        :root {
            --bg-primary: #fafaf8;
            --bg-secondary: #f5f4f0;
            --bg-tertiary: #eeede8;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-tertiary: #8a8a8a;
            --border-color: #e0dfda;
            --border-light: #eeede8;
            --accent-primary: #c7522b;
            --accent-secondary: #8b4513;
            --accent-warm: #d4a574;
            --font-display: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', sans-serif;
            --font-body: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', sans-serif;
            --font-mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2.5rem;
            --spacing-xl: 4rem;
            --spacing-2xl: 6rem;
            --max-width: 1200px;
            --max-width-narrow: 780px;
            --max-width-table: 1000px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.07);
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        .container-narrow {
            max-width: var(--max-width-narrow);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        .container-table {
            max-width: var(--max-width-table);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-sm) 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(250, 250, 248, 0.92);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: var(--spacing-md);
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--transition-fast);
            letter-spacing: -0.01em;
        }

        nav a:hover {
            color: var(--accent-primary);
        }

        nav a.active {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .page-hero {
            padding: var(--spacing-xl) 0 var(--spacing-lg);
            text-align: center;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-primary);
        }

        .page-hero .kicker {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: var(--spacing-xs);
        }

        .page-hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.25;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .page-hero .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 620px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .comparison-table-section {
            padding: var(--spacing-xl) 0;
        }

        .comparison-table-section h2 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-lg);
            text-align: center;
            color: var(--text-primary);
        }

        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .comparison-table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
        }

        .comparison-table thead th {
            background: var(--bg-tertiary);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-primary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 2px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
        }

        .comparison-table thead th:first-child {
            position: sticky;
            left: 0;
            background: var(--bg-tertiary);
            z-index: 2;
            border-right: 1px solid var(--border-color);
            min-width: 140px;
        }

        .comparison-table tbody td {
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            vertical-align: top;
            line-height: 1.5;
        }

        .comparison-table tbody td:first-child {
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-primary);
            position: sticky;
            left: 0;
            z-index: 1;
            border-right: 1px solid var(--border-light);
            white-space: nowrap;
        }

        .comparison-table tbody tr:last-child td {
            border-bottom: none;
        }

        .comparison-table tbody tr:hover td {
            background: rgba(212, 165, 116, 0.06);
        }

        .comparison-table tbody tr:hover td:first-child {
            background: rgba(212, 165, 116, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 0.2em 0.6em;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .badge-high {
            background: #fce4d6;
            color: #c0392b;
        }

        .badge-mid {
            background: #fef3e2;
            color: #e67e22;
        }

        .badge-low {
            background: #e8f5e9;
            color: #27ae60;
        }

        .badge-varies {
            background: #e3f2fd;
            color: #1565c0;
        }

        .insight-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-md);
            margin: var(--spacing-xl) 0;
        }

        .insight-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            transition: box-shadow var(--transition-smooth), transform var(--transition-smooth);
        }

        .insight-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .insight-card .card-icon {
            font-size: 1.6rem;
            margin-bottom: var(--spacing-xs);
        }

        .insight-card h3 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .insight-card p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .disclaimer-box {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--accent-warm);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-lg);
            margin: var(--spacing-lg) 0;
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .disclaimer-box strong {
            color: var(--text-primary);
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-lg) 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            letter-spacing: 0.01em;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        footer a:hover {
            color: var(--accent-primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 var(--spacing-sm);
            }
            .page-hero h1 {
                font-size: 1.75rem;
            }
            nav ul {
                gap: var(--spacing-sm);
            }
            nav a {
                font-size: 0.8rem;
            }
            .comparison-table {
                font-size: 0.8rem;
            }
            .comparison-table thead th,
            .comparison-table tbody td {
                padding: var(--spacing-xs) var(--spacing-sm);
            }
            .comparison-table thead th:first-child,
            .comparison-table tbody td:first-child {
                min-width: 110px;
            }
            .insight-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
